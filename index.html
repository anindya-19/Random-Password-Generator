<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">   
</head>
<body>
    <div class="password-generator-words">
        <h1 class="generate-text">Generate a</h1>
        <h1 class="random-pass-text">random password</h1>
        <p>Never use an insecure password again.</p>
    </div>

    <div class="password-actions">

        <button class="password-button" onclick="generateClicked()">Generate Passwords</button>
    </div>

    <div class="display-passwords">
        <div class="display-pass-one"></div>
        <div class="display-pass-two"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
